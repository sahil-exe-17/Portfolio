<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Obsidian Tile Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <!-- Aurora Spectrum Rim Light -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cff67" />
      <stop offset="50%" stop-color="#B497CF" />
      <stop offset="100%" stop-color="#5227FF" />
    </linearGradient>

    <!-- Ethereal Nebula Ambient Glow -->
    <radialGradient id="nebulaGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#5227FF" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#7cff67" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060608" stop-opacity="0" />
    </radialGradient>

    <!-- Premium Pure White / Titanium Gradient -->
    <linearGradient id="monogramGrad" x1="14" y1="16" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Quantum Pulse Emerald Gradient -->
    <linearGradient id="beaconGrad" x1="49" y1="39" x2="56" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cff67" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>

    <!-- Drop Shadow Filter for Sharp Legibility -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Obsidian Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- Ambient Light Fill -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#nebulaGlow)" />

  <!-- Monogram Group -->
  <g filter="url(#softGlow)">
    <!-- Letter S -->
    <path 
      d="M28 19H19C15.8 19 13.5 21.2 13.5 24.4C13.5 27.6 15.8 29.8 19 29.8H24C27.2 29.8 29.5 32 29.5 35.2C29.5 38.4 27.2 40.6 24 40.6H14" 
      stroke="url(#monogramGrad)" 
      stroke-width="4.4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letter L -->
    <path 
      d="M36 17.5V40.6H46" 
      stroke="url(#monogramGrad)" 
      stroke-width="4.4" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Glowing Quantum Pulse Dot '.' -->
    <circle cx="52" cy="40.6" r="3.2" fill="url(#beaconGrad)" />
    <circle cx="52" cy="40.6" r="1.4" fill="#FFFFFF" />
  </g>
</svg>