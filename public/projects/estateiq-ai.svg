<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-estateiq-ai" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091310" />
      <stop offset="50%" stop-color="#06090c" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>
    <linearGradient id="accent-estateiq-ai" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cff67" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <radialGradient id="glow-estateiq-ai" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7cff67" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-estateiq-ai">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bg-estateiq-ai)" />

  <!-- Ambient Holographic Light Orb -->
  <circle cx="580" cy="220" r="180" fill="url(#glow-estateiq-ai)" filter="url(#blur-estateiq-ai)" />

  <!-- High-Tech Geometric Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Glass Inner Container -->
  <rect x="40" y="40" width="720" height="520" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Outer Luminous Edge Accent -->
  <path d="M40 120 V50 A10 10 0 0 1 50 40 H140" fill="none" stroke="url(#accent-estateiq-ai)" stroke-width="3" stroke-linecap="round" />
  <path d="M760 480 V550 A10 10 0 0 1 750 560 H660" fill="none" stroke="url(#accent-estateiq-ai)" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <rect x="70" y="75" width="260" height="32" rx="16" fill="rgba(124,255,103,0.08)" stroke="rgba(124,255,103,0.3)" />
  <circle cx="86" cy="91" r="4" fill="#7cff67" />
  <text x="100" y="96" fill="#7cff67" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1.5">PROPTECH VALUATION &amp; AI</text>

  <!-- Metric Badge -->
  <text x="730" y="96" fill="rgba(255,255,255,0.55)" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">Random Forest ML // Groq GenAI Consultant</text>

  <!-- Graphic Display Window in Center -->
  <rect x="70" y="130" width="660" height="280" rx="16" fill="#06090d" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Top bar of window -->
  <rect x="70" y="130" width="660" height="36" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="95" cy="148" r="4.5" fill="#ff5f56" />
  <circle cx="112" cy="148" r="4.5" fill="#ffbd2e" />
  <circle cx="129" cy="148" r="4.5" fill="#27c93f" />
  <text x="400" y="153" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="11" text-anchor="middle">https://estateiq-ai-omega.vercel.app</text>

  <!-- Architectural Silhouette & Valuation Graph -->
  <!-- Skyline wireframe -->
  <path d="M120 370 V290 H170 V320 H220 V250 H270 V300 H320 V230 H380 V370" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <path d="M380 370 V270 H430 V220 H490 V280 H540 V200 H600 V310 H660 V370" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Valuation Yield Curve -->
  <path d="M100 340 Q220 310 320 270 T500 210 T680 170" fill="none" stroke="url(#accent-estateiq-ai)" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  <path d="M100 360 Q220 330 320 290 T500 230 T680 190" fill="none" stroke="rgba(124,255,103,0.2)" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Telemetry Nodes -->
  <circle cx="320" cy="270" r="6" fill="#06090d" stroke="#7cff67" stroke-width="2.5" />
  <circle cx="500" cy="210" r="6" fill="#06090d" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="680" cy="170" r="7" fill="#7cff67" stroke="#ffffff" stroke-width="2" />

  <!-- Floating Metric Callout -->
  <g transform="translate(480, 245)">
    <rect width="180" height="42" rx="8" fill="rgba(10,18,15,0.85)" stroke="rgba(124,255,103,0.4)" stroke-width="1" />
    <text x="12" y="18" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">INVESTMENT SCORE</text>
    <text x="12" y="34" fill="#7cff67" font-family="monospace" font-size="13" font-weight="bold">94.8 / 100 [HIGH ROI]</text>
  </g>

  <!-- Project Title Bottom Section -->
  <text x="70" y="470" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">EstateIQ AI</text>
  <text x="70" y="505" fill="rgba(255,255,255,0.65)" font-family="monospace" font-size="13" letter-spacing="1.5">INTELLIGENT PROPTECH VALUATION &amp; INVESTMENT PLATFORM</text>

  <!-- Launch Glyph -->
  <g transform="translate(680, 460)">
    <circle cx="20" cy="20" r="24" fill="rgba(124,255,103,0.1)" stroke="rgba(124,255,103,0.4)" />
    <path d="M14 26 L26 14 M26 14 H18 M26 14 V22" fill="none" stroke="#7cff67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
