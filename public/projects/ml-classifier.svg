<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-ml-classifier" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="accent-ml-classifier" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="glow-ml-classifier" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-ml-classifier">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg-ml-classifier)" />
  <circle cx="580" cy="220" r="180" fill="url(#glow-ml-classifier)" filter="url(#blur-ml-classifier)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <rect x="40" y="40" width="720" height="520" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <path d="M40 120 V50 A10 10 0 0 1 50 40 H140" fill="none" stroke="url(#accent-ml-classifier)" stroke-width="3" stroke-linecap="round" />
  <path d="M760 480 V550 A10 10 0 0 1 750 560 H660" fill="none" stroke="url(#accent-ml-classifier)" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <rect x="70" y="75" width="230" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="86" cy="91" r="4" fill="#00FFA3" />
  <text x="100" y="96" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="12" letter-spacing="1.5">INTERACTIVE ML PLATFORM</text>
  <text x="730" y="96" fill="rgba(255,255,255,0.45)" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">Scikit-Learn // Real-Time Tuning</text>

  <!-- Graphic Display Window -->
  <rect x="70" y="130" width="660" height="280" rx="16" fill="#09090d" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect x="70" y="130" width="660" height="36" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="95" cy="148" r="4" fill="#ff5f56" />
  <circle cx="110" cy="148" r="4" fill="#ffbd2e" />
  <circle cx="125" cy="148" r="4" fill="#27c93f" />

  <!-- Decision Boundary & Data Points Graphic -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="600" height="200" rx="8" fill="rgba(255,255,255,0.02)" />
    <!-- Decision curves -->
    <path d="M 50 180 Q 200 40 400 120 T 550 50" fill="none" stroke="#00FFA3" stroke-width="2.5" stroke-dasharray="6,4" />
    <path d="M 50 140 Q 250 160 380 60 T 550 100" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6" />
    <!-- Scatter nodes -->
    <circle cx="90" cy="70" r="7" fill="#00FFA3" />
    <circle cx="140" cy="110" r="5" fill="#00FFA3" opacity="0.8" />
    <circle cx="190" cy="60" r="8" fill="#00FFA3" />
    <circle cx="280" cy="110" r="6" fill="#00FFA3" />
    <circle cx="350" cy="160" r="7" fill="#3B82F6" />
    <circle cx="430" cy="80" r="6" fill="#3B82F6" />
    <circle cx="490" cy="140" r="8" fill="#3B82F6" />
    <circle cx="520" cy="70" r="5" fill="#3B82F6" />
  </g>

  <!-- Title & Tech Footer -->
  <text x="70" y="460" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="-1">ML Classifier Studio</text>
  <text x="70" y="490" fill="rgba(255,255,255,0.55)" font-family="system-ui, sans-serif" font-size="15">Interactive algorithm benchmark &amp; visual decision engine.</text>
  <rect x="70" y="515" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="105" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">PYTHON</text>
  <rect x="148" y="515" width="86" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="191" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">FASTAPI</text>
  <rect x="242" y="515" width="105" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="294" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">SCIKIT-LEARN</text>
</svg>
