<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-yt-predictor" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="accent-yt-predictor" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <radialGradient id="glow-yt-predictor" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-yt-predictor">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg-yt-predictor)" />
  <circle cx="580" cy="220" r="180" fill="url(#glow-yt-predictor)" filter="url(#blur-yt-predictor)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <rect x="40" y="40" width="720" height="520" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <path d="M40 120 V50 A10 10 0 0 1 50 40 H140" fill="none" stroke="url(#accent-yt-predictor)" stroke-width="3" stroke-linecap="round" />
  <path d="M760 480 V550 A10 10 0 0 1 750 560 H660" fill="none" stroke="url(#accent-yt-predictor)" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <rect x="70" y="75" width="220" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="86" cy="91" r="4" fill="#FF0000" />
  <text x="100" y="96" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="12" letter-spacing="1.5">ML ANALYTICS DASHBOARD</text>
  <text x="730" y="96" fill="rgba(255,255,255,0.45)" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">Facebook Prophet // Time Series</text>

  <!-- Graphic Display Window -->
  <rect x="70" y="130" width="660" height="280" rx="16" fill="#09090d" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect x="70" y="130" width="660" height="36" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="95" cy="148" r="4" fill="#ff5f56" />
  <circle cx="110" cy="148" r="4" fill="#ffbd2e" />
  <circle cx="125" cy="148" r="4" fill="#27c93f" />

  <!-- Growth Forecast Area Chart Graphic -->
  <g transform="translate(100, 180)">
    <!-- Confidence Interval Band -->
    <path d="M 40 160 Q 180 120 300 80 T 560 20 L 560 60 Q 420 120 300 130 T 40 180 Z" fill="rgba(255, 0, 0, 0.15)" />
    <!-- Forecast Curve -->
    <path d="M 40 170 Q 180 135 300 95 T 560 35" fill="none" stroke="#FF0000" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="560" cy="35" r="6" fill="#FF7A00" />
    <!-- Historical Dots -->
    <circle cx="90" cy="160" r="4" fill="#ffffff" />
    <circle cx="160" cy="142" r="4" fill="#ffffff" />
    <circle cx="230" cy="120" r="4" fill="#ffffff" />
    <circle cx="300" cy="95" r="5" fill="#FF0000" />
  </g>

  <!-- Title & Tech Footer -->
  <text x="70" y="460" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="-1">YT Predictor</text>
  <text x="70" y="490" fill="rgba(255,255,255,0.55)" font-family="system-ui, sans-serif" font-size="15">Time-series subscriber forecasting using Prophet and YouTube Data API.</text>
  <rect x="70" y="515" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="105" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">PYTHON</text>
  <rect x="148" y="515" width="85" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="190" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">STREAMLIT</text>
  <rect x="241" y="515" width="75" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="278" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">PROPHET</text>
</svg>
