<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-india-intern" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140e0a" />
      <stop offset="50%" stop-color="#090b12" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>
    <linearGradient id="accent-india-intern" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <radialGradient id="glow-india-intern" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-india-intern">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bg-india-intern)" />

  <!-- Ambient Light Orb -->
  <circle cx="580" cy="200" r="180" fill="url(#glow-india-intern)" filter="url(#blur-india-intern)" />

  <!-- High-Tech Geometric Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Glass Inner Container -->
  <rect x="40" y="40" width="720" height="520" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Outer Luminous Edge Accent -->
  <path d="M40 120 V50 A10 10 0 0 1 50 40 H140" fill="none" stroke="url(#accent-india-intern)" stroke-width="3" stroke-linecap="round" />
  <path d="M760 480 V550 A10 10 0 0 1 750 560 H660" fill="none" stroke="url(#accent-india-intern)" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <rect x="70" y="75" width="280" height="32" rx="16" fill="rgba(255,153,51,0.1)" stroke="rgba(255,153,51,0.35)" />
  <circle cx="86" cy="91" r="4" fill="#FF9933" />
  <text x="100" y="96" fill="#FF9933" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.2">SMART INDIA HACKATHON 2025</text>

  <!-- Metric Badge -->
  <text x="730" y="96" fill="rgba(255,255,255,0.55)" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">PS ID: 25034 // PM INTERNSHIP SCHEME</text>

  <!-- Graphic Display Window in Center -->
  <rect x="70" y="130" width="660" height="280" rx="16" fill="#07090f" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Top bar of window -->
  <rect x="70" y="130" width="660" height="36" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="95" cy="148" r="4.5" fill="#ff5f56" />
  <circle cx="112" cy="148" r="4.5" fill="#ffbd2e" />
  <circle cx="129" cy="148" r="4.5" fill="#27c93f" />
  <text x="400" y="153" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="11" text-anchor="middle">gov.in/pm-internship/ai-recommendation-engine</text>

  <!-- Neural Matching Graph Visual -->
  <!-- Student Nodes (Left) -->
  <g transform="translate(140, 200)">
    <circle cx="0" cy="0" r="18" fill="rgba(255,153,51,0.15)" stroke="#FF9933" stroke-width="2" />
    <text x="0" y="4" fill="#fff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SKILL</text>
    
    <circle cx="0" cy="65" r="18" fill="rgba(255,153,51,0.15)" stroke="#FF9933" stroke-width="2" />
    <text x="0" y="69" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">TALENT</text>
    
    <circle cx="0" cy="130" r="18" fill="rgba(255,153,51,0.15)" stroke="#FF9933" stroke-width="2" />
    <text x="0" y="134" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">RURAL</text>
  </g>

  <!-- Central AI Matching Hub -->
  <g transform="translate(400, 265)">
    <circle cx="0" cy="0" r="42" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 4" />
    <text x="0" y="-6" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">INDIA</text>
    <text x="0" y="10" fill="#fff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">INTERN AI</text>
    <text x="0" y="24" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="8" text-anchor="middle">NLP MATCH</text>
  </g>

  <!-- Recruiter / Opportunity Nodes (Right) -->
  <g transform="translate(660, 200)">
    <circle cx="0" cy="0" r="18" fill="rgba(19,136,8,0.15)" stroke="#138808" stroke-width="2" />
    <text x="0" y="4" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">PM SCHEME</text>
    
    <circle cx="0" cy="65" r="18" fill="rgba(19,136,8,0.15)" stroke="#138808" stroke-width="2" />
    <text x="0" y="69" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">HIRING</text>
    
    <circle cx="0" cy="130" r="18" fill="rgba(19,136,8,0.15)" stroke="#138808" stroke-width="2" />
    <text x="0" y="134" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">RANKING</text>
  </g>

  <!-- Connecting Synapse Lines -->
  <path d="M158 200 C 260 200, 320 250, 358 265" fill="none" stroke="#FF9933" stroke-width="2" opacity="0.75" />
  <path d="M158 265 L 358 265" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
  <path d="M158 330 C 260 330, 320 280, 358 265" fill="none" stroke="#FF9933" stroke-width="2" opacity="0.75" />
  
  <path d="M442 265 C 480 250, 540 200, 642 200" fill="none" stroke="#138808" stroke-width="2" opacity="0.75" />
  <path d="M442 265 L 642 265" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
  <path d="M442 265 C 480 280, 540 330, 642 330" fill="none" stroke="#138808" stroke-width="2" opacity="0.75" />

  <!-- Project Title Bottom Section -->
  <text x="70" y="470" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">India Intern AI</text>
  <text x="70" y="505" fill="rgba(255,255,255,0.65)" font-family="monospace" font-size="13" letter-spacing="1.5">AI INTERNSHIP RECOMMENDATION &amp; RECRUITER RANKING PLATFORM</text>

  <!-- Launch Glyph -->
  <g transform="translate(680, 460)">
    <circle cx="20" cy="20" r="24" fill="rgba(255,153,51,0.12)" stroke="rgba(255,153,51,0.4)" />
    <path d="M14 26 L26 14 M26 14 H18 M26 14 V22" fill="none" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
