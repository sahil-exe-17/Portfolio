<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-earniq" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="accent-earniq" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <radialGradient id="glow-earniq" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-earniq">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bg-earniq)" />
  <circle cx="580" cy="220" r="180" fill="url(#glow-earniq)" filter="url(#blur-earniq)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <rect x="40" y="40" width="720" height="520" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <path d="M40 120 V50 A10 10 0 0 1 50 40 H140" fill="none" stroke="url(#accent-earniq)" stroke-width="3" stroke-linecap="round" />
  <path d="M760 480 V550 A10 10 0 0 1 750 560 H660" fill="none" stroke="url(#accent-earniq)" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <rect x="70" y="75" width="220" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="86" cy="91" r="4" fill="#F59E0B" />
  <text x="100" y="96" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="12" letter-spacing="1.5">DATA SCIENCE PLATFORM</text>
  <text x="730" y="96" fill="rgba(255,255,255,0.45)" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">XGBoost // Predictive Modeling</text>

  <!-- Graphic Display Window -->
  <rect x="70" y="130" width="660" height="280" rx="16" fill="#09090d" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <rect x="70" y="130" width="660" height="36" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="95" cy="148" r="4" fill="#ff5f56" />
  <circle cx="110" cy="148" r="4" fill="#ffbd2e" />
  <circle cx="125" cy="148" r="4" fill="#27c93f" />

  <!-- Predictive Bar Charts Graphic -->
  <g transform="translate(110, 185)">
    <line x1="0" y1="180" x2="580" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="40" y="90" width="38" height="90" rx="4" fill="#F59E0B" opacity="0.8" />
    <rect x="110" y="60" width="38" height="120" rx="4" fill="#F59E0B" opacity="0.9" />
    <rect x="180" y="110" width="38" height="70" rx="4" fill="#F59E0B" opacity="0.6" />
    <rect x="250" y="30" width="38" height="150" rx="4" fill="url(#accent-earniq)" />
    <rect x="320" y="75" width="38" height="105" rx="4" fill="#F59E0B" opacity="0.85" />
    <rect x="390" y="45" width="38" height="135" rx="4" fill="url(#accent-earniq)" />
    <rect x="460" y="15" width="38" height="165" rx="4" fill="#EF4444" />
    <!-- Trend Line -->
    <path d="M 59 80 L 129 50 L 199 100 L 269 20 L 339 65 L 409 35 L 479 10" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="479" cy="10" r="5" fill="#ffffff" />
  </g>

  <!-- Title & Tech Footer -->
  <text x="70" y="460" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="-1">EarnIQ</text>
  <text x="70" y="490" fill="rgba(255,255,255,0.55)" font-family="system-ui, sans-serif" font-size="15">Predictive compensation intelligence engine powered by XGBoost regression.</text>
  <rect x="70" y="515" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="105" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">PYTHON</text>
  <rect x="148" y="515" width="65" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="180" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">FLASK</text>
  <rect x="221" y="515" width="85" height="24" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="263" y="531" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="11" text-anchor="middle">XGBOOST</text>
</svg>
