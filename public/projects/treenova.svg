<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg-treenova" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>
    <linearGradient id="accent-treenova" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <radialGradient id="glow-treenova" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FF007A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-treenova">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bg-treenova)" />

  <!-- Ambient Holographic Light Orb -->
  <circle cx="580" cy="220" r="180" fill="url(#glow-treenova)" filter="url(#blur-treenova)" />

  <!-- High-Tech Geometric Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Glass Inner Container -->
  <rect x="40" y="40" width="720" height="520" rx="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Outer Luminous Edge Accent -->
  <path d="M40 120 V50 A10 10 0 0 1 50 40 H140" fill="none" stroke="url(#accent-treenova)" stroke-width="3" stroke-linecap="round" />
  <path d="M760 480 V550 A10 10 0 0 1 750 560 H660" fill="none" stroke="url(#accent-treenova)" stroke-width="3" stroke-linecap="round" />

  <!-- Category Badge -->
  <rect x="70" y="75" width="220" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="86" cy="91" r="4" fill="#00F5FF" />
  <text x="100" y="96" fill="rgba(255,255,255,0.8)" font-family="monospace" font-size="12" letter-spacing="1.5" text-transform="uppercase">Cyberpunk BST Visualizer</text>

  <!-- Metric Badge -->
  <text x="730" y="96" fill="rgba(255,255,255,0.45)" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="end">Web Audio Synthesizer // Recursive Math</text>

  <!-- Graphic Display Window in Center -->
  <rect x="70" y="130" width="660" height="280" rx="16" fill="#09090d" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Top bar of window -->
  <rect x="70" y="130" width="660" height="36" rx="16" fill="rgba(255,255,255,0.03)" />
  <circle cx="95" cy="148" r="4.5" fill="#ff5f56" />
  <circle cx="112" cy="148" r="4.5" fill="#ffbd2e" />
  <circle cx="129" cy="148" r="4.5" fill="#27c93f" />
  <text x="400" y="153" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="11" text-anchor="middle">sys://preview/treenova.runtime</text>

  <!-- Waveform / Visual Matrix Graphic -->
  <path d="M100 300 Q160 220 220 300 T340 300 T460 200 T580 340 T700 270" fill="none" stroke="url(#accent-treenova)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <path d="M100 320 Q180 360 260 280 T420 330 T540 260 T700 310" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Neural Dots on Wave -->
  <circle cx="220" cy="300" r="5" fill="#ffffff" stroke="#00F5FF" stroke-width="2" />
  <circle cx="460" cy="200" r="6" fill="#ffffff" stroke="#FF007A" stroke-width="2.5" />
  <circle cx="580" cy="340" r="5" fill="#ffffff" stroke="#00F5FF" stroke-width="2" />

  <!-- Project Title Bottom Section -->
  <text x="70" y="470" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">TreeNova</text>
  <text x="70" y="505" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="14" letter-spacing="1.5">SAHIL LALE // INTELLIGENT SYSTEMS ARCHITECTURE</text>

  <!-- Launch Glyph -->
  <g transform="translate(680, 460)">
    <circle cx="20" cy="20" r="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <path d="M14 26 L26 14 M26 14 H18 M26 14 V22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>